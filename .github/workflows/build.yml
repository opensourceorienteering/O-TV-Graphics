# Builds the macOS and Windows packages, each on its own platform so the NDI addon
# (@stagetimerio/grandiose) is compiled for it. Runs on pushes to main, on version tags
# (v1.2.0) and from the Actions tab. The installers are attached to the run as artifacts.
# A version tag also publishes them as a GitHub release, which the website's download
# buttons link to. The tag must match the version in package.json (v1.2.0 = "1.2.0").
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: --mac --arm64
            artifact: split-control-mac-arm64
          - name: Windows (x64)
            os: windows-latest
            target: --win --x64
            artifact: split-control-windows-x64
    env:
      # Fail the package step if NDI is missing instead of shipping without it
      REQUIRE_NDI: "1"
      # No signing certificates in CI yet: build unsigned packages
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Also compiles the NDI addon for this platform (downloads the NDI 6 SDK)
      - name: Install dependencies
        run: npm ci

      - name: Check NDI bindings
        run: node scripts/verify-grandiose.js

      - name: Test
        run: npx vitest run

      - name: Package the Companion module
        run: |
          npm ci --prefix companion
          npm run companion:package

      - name: Type-check and bundle
        run: |
          npx tsc
          npx vite build

      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v5
        with:
          path: dist-release
          merge-multiple: true

      # Pre-releases (v1.2.0-beta.1) are marked as such and don't become "latest"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; *) prerelease="" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease --generate-notes \
            --title "Split Control $GITHUB_REF_NAME" \
            $(find dist-release -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \))
