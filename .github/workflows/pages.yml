# Publishes the website in site/ (downloads, looks, manual, FAQ) to GitHub Pages, with every
# look in templates/sets/ zipped for download and served for the preview page (scripts/build-site.sh).
# One-time setup: Settings → Pages → Source: GitHub Actions.
# Publishes only site/: the index.html at the repository root is the app, not the website.
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "templates/sets/**"
      - "scripts/zip-looks.sh"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Pages, every look zipped (looks/) and the looks for the preview page (preview/)
      - name: Build the site
        run: scripts/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
