# Publishes the website in site/ (downloads, looks, manual, FAQ) to GitHub Pages, with every
# look in templates/sets/ zipped for download (site/looks/).
# One-time setup: Settings → Pages → Source: GitHub Actions.
# Publishes only site/: the index.html at the repository root is the app, not the website.
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "templates/sets/**"
      - "scripts/zip-looks.sh"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Zip the looks
        run: scripts/zip-looks.sh site/looks
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
