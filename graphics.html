<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split Control Graphics Output</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        background: transparent;
        font-family: Arial, sans-serif;
      }

      #graphics-container {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: transparent;
      }

      /* Debug overlay (only visible in dev mode) */
      #debug-overlay {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: #0f0;
        padding: 10px;
        border-radius: 4px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        z-index: 10000;
        display: none;
      }

      #debug-overlay.visible {
        display: block;
      }

      #debug-overlay .status {
        margin-bottom: 5px;
      }

      #debug-overlay .status.connected {
        color: #0f0;
      }

      #debug-overlay .status.disconnected {
        color: #f00;
      }
    </style>
  </head>
  <body>
    <div id="graphics-container"></div>
    <div id="debug-overlay">
      <div class="status" id="ws-status">WebSocket: Disconnected</div>
      <div id="loaded-graphics">Loaded: 0</div>
      <div id="playing-graphics">Playing: 0</div>
    </div>

    <script type="module" src="/src/renderer/graphics/main.ts"></script>
  </body>
</html>
